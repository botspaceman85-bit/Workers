name: DUTA Flutter Worker v2

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
        type: string
      userId:
        required: true
        type: string
      payload:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: duta-flutter-${{ inputs.jobId }}
  cancel-in-progress: false

env:
  PAYLOAD: ${{ inputs.payload }}
  JOB_ID: ${{ inputs.jobId }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Init
        id: cfg
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/source" "$RUNNER_TEMP/out" "$RUNNER_TEMP/work"
          python3 - <<'PY'
          import json,os
          p=json.loads(os.environ['PAYLOAD'])
          if not p.get('url'): raise SystemExit('payload.url tidak ditemukan')
          mode=str(p.get('buildType') or 'release').lower()
          if mode not in ('debug','profile','release'): mode='release'
          flutter=str(p.get('flutterVersion') or '').strip()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('url='+p['url']+'\n')
              f.write('mode='+mode+'\n')
              f.write('flutter='+flutter+'\n')
          PY
          echo '::notice title=BUILD_PROGRESS::0|INIT|Worker siap'

      - name: Fast source download
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-all-errors --connect-timeout 15 --max-time 600 \
            -A 'DUTA-Worker/2' -o "$RUNNER_TEMP/source.zip" '${{ steps.cfg.outputs.url }}'
          echo '::notice title=BUILD_PROGRESS::10|DOWNLOAD|Source selesai'

      - name: Safe extract + locate
        id: project
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,zipfile
          src=os.path.join(os.environ['RUNNER_TEMP'],'source.zip')
          dst=os.path.join(os.environ['RUNNER_TEMP'],'source')
          root=os.path.realpath(dst); os.makedirs(dst,exist_ok=True)
          with zipfile.ZipFile(src) as z:
              for i in z.infolist():
                  o=os.path.realpath(os.path.join(dst,i.filename))
                  if not (o==root or o.startswith(root+os.sep)): raise SystemExit('Unsafe ZIP path')
              z.extractall(dst)
          found=''
          if os.path.isfile(os.path.join(dst,'pubspec.yaml')): found=dst
          else:
              for b,ds,fs in os.walk(dst):
                  if 'pubspec.yaml' in fs: found=b; break
          if not found: raise SystemExit('pubspec.yaml tidak ditemukan')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('path='+found+'\n')
          PY
          echo '::notice title=BUILD_PROGRESS::20|DETECT|Flutter project ditemukan'

      - name: Java + Gradle cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Flutter SDK + cache
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.cfg.outputs.flutter }}
          cache: true

      - name: Pub cache
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: duta-pub-${{ runner.os }}-${{ steps.cfg.outputs.flutter || 'stable' }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            duta-pub-${{ runner.os }}-${{ steps.cfg.outputs.flutter || 'stable' }}-
            duta-pub-${{ runner.os }}-

      - name: Dependencies
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          set -euo pipefail
          flutter pub get
          echo '::notice title=BUILD_PROGRESS::40|DEPENDENCIES|Cache/dependencies siap'

      - name: Build
        id: build
        continue-on-error: true
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -o pipefail
          case '${{ steps.cfg.outputs.mode }}' in
            debug) flutter build apk --debug --no-pub 2>&1 | tee "$RUNNER_TEMP/work/error.log" ;;
            profile) flutter build apk --profile --no-pub 2>&1 | tee "$RUNNER_TEMP/work/error.log" ;;
            *) flutter build apk --release --no-pub 2>&1 | tee "$RUNNER_TEMP/work/error.log" ;;
          esac

      - name: Groq auto-fix
        if: steps.build.outcome == 'failure'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          set -euo pipefail
          [ -n "${GROQ_API_KEY:-}" ] || exit 0
          python3 - <<'PY'
          import os,json,urllib.request
          log=open(os.path.join(os.environ['RUNNER_TEMP'],'work/error.log'),errors='ignore').read()[-24000:]
          prompt='Return ONLY JSON {"patches":[{"path":"...","find":"exact text","replace":"replacement"}]}. Only pubspec.yaml or android/**. No shell commands, no Dart source, no secrets. Minimal compatibility fixes only.\nERROR:\n'+log
          body=json.dumps({'model':os.environ['GROQ_MODEL'],'temperature':0,'messages':[{'role':'system','content':'Valid JSON only.'},{'role':'user','content':prompt}]}).encode()
          req=urllib.request.Request('https://api.groq.com/openai/v1/chat/completions',data=body,headers={'Authorization':'Bearer '+os.environ['GROQ_API_KEY'],'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=90) as r: d=json.load(r)
          c=d['choices'][0]['message']['content'].replace('```json','').replace('```','').strip()
          data=json.loads(c); root=os.path.realpath('.')
          for p in data.get('patches',[]):
              path=p.get('path','')
              if not (path=='pubspec.yaml' or path.startswith('android/')): raise SystemExit('unsafe patch')
              full=os.path.realpath(path)
              if not (full==root or full.startswith(root+os.sep)): raise SystemExit('path traversal')
              s=open(full,encoding='utf-8').read(); old=p.get('find','')
              if not old or old not in s: raise SystemExit('patch context not found')
              open(full,'w',encoding='utf-8').write(s.replace(old,p.get('replace',''),1))
          PY

      - name: Rebuild after fix
        id: rebuild
        if: steps.build.outcome == 'failure'
        continue-on-error: true
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -o pipefail
          flutter pub get
          case '${{ steps.cfg.outputs.mode }}' in
            debug) flutter build apk --debug --no-pub 2>&1 | tee "$RUNNER_TEMP/work/error2.log" ;;
            profile) flutter build apk --profile --no-pub 2>&1 | tee "$RUNNER_TEMP/work/error2.log" ;;
            *) flutter build apk --release --no-pub 2>&1 | tee "$RUNNER_TEMP/work/error2.log" ;;
          esac

      - name: Collect APK
        if: steps.build.outcome == 'success' || steps.rebuild.outcome == 'success'
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          set -euo pipefail
          apk=$(find build/app/outputs/apk -type f -name '*.apk' -print -quit)
          [ -n "$apk" ] || exit 1
          cp "$apk" "$RUNNER_TEMP/out/app-${{ inputs.jobId }}.apk"
          sha256sum "$RUNNER_TEMP/out/app-${{ inputs.jobId }}.apk"

      - name: Upload artifact uncompressed
        if: steps.build.outcome == 'success' || steps.rebuild.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: ${{ runner.temp }}/out/app-*.apk
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: steps.build.outcome == 'success' || steps.rebuild.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="duta-build-${{ inputs.jobId }}"
          title="DUTA APK ${{ inputs.jobId }}"
          gh release create "$tag" "$RUNNER_TEMP/out/app-${{ inputs.jobId }}.apk" \
            --repo "$GITHUB_REPOSITORY" --title "$title" --notes "Automated APK build ${{ inputs.jobId }}" --target "$GITHUB_SHA" || \
          gh release upload "$tag" "$RUNNER_TEMP/out/app-${{ inputs.jobId }}.apk" --repo "$GITHUB_REPOSITORY" --clobber
          echo "::notice title=APK_READY::Release tag $tag"

      - name: Fail with useful log
        if: steps.build.outcome == 'failure' && steps.rebuild.outcome != 'success'
        run: |
          tail -n 180 "$RUNNER_TEMP/work/error2.log" 2>/dev/null || tail -n 180 "$RUNNER_TEMP/work/error.log" || true
          exit 1
